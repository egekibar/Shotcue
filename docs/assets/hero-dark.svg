<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Shotcue</title>
  <desc id="d">A region of a web page is selected with the global shortcut; the Shotcue quick panel shows the capture, a typed note and a voice note; Claude Code then runs the task and reports the result.</desc>
  <style>
    .bg0 { stop-color: #0E1122; } .bg1 { stop-color: #171230; }
    .glowA { stop-color: #4A70F5; stop-opacity: .30; } .glowB { stop-color: #7B4BE0; stop-opacity: .28; } .glowC { stop-color: #FFC83D; stop-opacity: .06; }
    .glow0 { stop-opacity: 0; }
    .dot { fill: #FFFFFF; fill-opacity: .05; }
    .win { fill: #1A1D2A; stroke: #2B3043; }
    .bar { fill: #222638; } .hair { stroke: #2E3347; } .pill { fill: #2C3145; }
    .page { fill: #141722; } .card { fill: #1E2231; stroke: #30364A; }
    .input { fill: #262B3B; stroke: #363C51; } .line { fill: #2E3346; }
    .ink { fill: #E9EBF2; } .muted { fill: #8F96AB; } .faint { fill: #6A7188; }
    .accent { fill: #7B96FF; } .accentStroke { stroke: #7B96FF; }
    .pet0 { fill: #3A2921; } .pet1 { fill: #1F2A47; } .pet2 { fill: #1C3326; }
    .dim { fill: #000000; fill-opacity: .42; }
    .panel { fill: #1F2335; fill-opacity: .97; stroke: #343A51; }
    .control { fill: #2A2F43; stroke: #3A4058; } .segTrack { fill: #2A2F43; } .segSel { fill: #4A5068; stroke: #565D78; }
    .field { fill: #262A3C; } .glassBtn { fill: #2A2F43; stroke: #3B4159; } .meterOff { fill: #8F96AB; fill-opacity: .25; }
    .key { fill: #262A3B; stroke: #3A4058; } .keyShadow { fill: #07080F; }
    .term { fill: #0A0C13; stroke: #2A3042; }
    .flow { stroke: #7B96FF; stroke-opacity: .6; } .flowMark { stroke: #7B96FF; stroke-opacity: .85; }
    #shadow feDropShadow { flood-color: #000000; flood-opacity: .45; }
    #softShadow feDropShadow { flood-color: #000000; flood-opacity: .30; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="bg0"/><stop offset="1" class="bg1"/></linearGradient>
    <radialGradient id="glowA"><stop offset="0" class="glowA"/><stop offset="1" class="glowA glow0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" class="glowB"/><stop offset="1" class="glowB glow0"/></radialGradient>
    <radialGradient id="glowC"><stop offset="0" class="glowC"/><stop offset="1" class="glowC glow0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A70F5"/><stop offset="1" stop-color="#5C38CC"/></linearGradient>
    <linearGradient id="brandH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A70F5"/><stop offset="1" stop-color="#5C38CC"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" class="dot"/></pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="16" stdDeviation="20"/></filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6"/></filter>
    <clipPath id="winClip"><rect x="56" y="96" width="716" height="496" rx="14"/></clipPath>
    <clipPath id="thumbClip"><rect x="826" y="88" width="180" height="116" rx="9"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" class="flowMark" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- Backdrop -->
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="28" fill="url(#dots)"/>
  <circle cx="170" cy="60" r="440" fill="url(#glowA)"/>
  <circle cx="1180" cy="620" r="480" fill="url(#glowB)"/>
  <circle cx="1010" cy="110" r="280" fill="url(#glowC)"/>

  <!-- Global shortcut -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="19" text-anchor="middle">
    <rect x="56" y="33" width="40" height="40" rx="9" class="keyShadow"/><rect x="56" y="30" width="40" height="40" rx="9" class="key"/><text x="76" y="57" class="ink">⌃</text>
    <rect x="104" y="33" width="40" height="40" rx="9" class="keyShadow"/><rect x="104" y="30" width="40" height="40" rx="9" class="key"/><text x="124" y="57" class="ink">⇧</text>
    <rect x="152" y="33" width="40" height="40" rx="9" class="keyShadow"/><rect x="152" y="30" width="40" height="40" rx="9" class="key"/><text x="172" y="57" class="ink">2</text>
  </g>
  <path d="M204 52 C 300 52, 372 104, 398 172" fill="none" class="flow" stroke-width="2.2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)"/>

