  <g filter="url(#shadow)"><rect x="56" y="96" width="716" height="496" rx="14" class="win"/></g>
  <g clip-path="url(#winClip)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="56" y="96" width="716" height="44" class="bar"/>
    <line x1="56" y1="140.5" x2="772" y2="140.5" class="hair"/>
    <circle cx="78" cy="118" r="6" fill="#FF5F57"/><circle cx="98" cy="118" r="6" fill="#FEBC2E"/><circle cx="118" cy="118" r="6" fill="#28C840"/>
    <rect x="264" y="107" width="300" height="22" rx="11" class="pill"/>
    <text x="414" y="122.5" font-size="12" text-anchor="middle" class="muted">pati.app/giris</text>
    <rect x="56" y="141" width="716" height="451" class="page"/>
