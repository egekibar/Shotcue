      <rect x="106" y="424" width="60" height="7" rx="3.5" fill="#FF9E6B" fill-opacity=".45"/><rect x="106" y="437" width="40" height="7" rx="3.5" fill="#FF9E6B" fill-opacity=".3"/>
      <rect x="192" y="348" width="88" height="112" rx="12" class="pet1"/>
      <circle cx="236" cy="390" r="19" fill="#7FA2FF"/><path d="M219 380 L221 360 L233 373 Z M253 380 L251 360 L239 373 Z" fill="#7FA2FF"/>
      <rect x="206" y="424" width="60" height="7" rx="3.5" fill="#7FA2FF" fill-opacity=".45"/><rect x="206" y="437" width="40" height="7" rx="3.5" fill="#7FA2FF" fill-opacity=".3"/>
      <rect x="292" y="348" width="88" height="112" rx="12" class="pet2"/>
      <circle cx="336" cy="392" r="18" fill="#62C987"/><ellipse cx="320" cy="380" rx="6" ry="11" fill="#62C987"/><ellipse cx="352" cy="380" rx="6" ry="11" fill="#62C987"/>
      <rect x="306" y="424" width="60" height="7" rx="3.5" fill="#62C987" fill-opacity=".45"/><rect x="306" y="437" width="40" height="7" rx="3.5" fill="#62C987" fill-opacity=".3"/>
    </g>
    <rect x="92" y="486" width="132" height="32" rx="16" fill="#FF8A4C" fill-opacity=".14"/>
    <text x="158" y="507" font-size="13" font-weight="600" text-anchor="middle" fill="#E0703A">Tümünü gör →</text>

    <!-- Login card (the bug: the button overflows the card) -->
