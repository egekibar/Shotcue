    <path d="M438 188 H408 V218 M734 188 H764 V218 M438 536 H408 V506 M734 536 H764 V506" stroke="url(#brand)" stroke-width="5.5"/>
  </g>
  <rect x="660" y="546" width="80" height="24" rx="7" fill="#111322" fill-opacity=".86"/>
