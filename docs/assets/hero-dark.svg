    <text x="114" y="176" font-size="18" font-weight="700" class="ink">pati</text>
    <rect x="496" y="165" width="56" height="10" rx="5" class="line"/><rect x="564" y="165" width="48" height="10" rx="5" class="line"/><rect x="624" y="165" width="70" height="10" rx="5" class="line"/>
